apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
data:
  001-schema.sql: |
    CREATE TABLE IF NOT EXISTS products (
        id BIGINT NOT NULL AUTO_INCREMENT,
        name VARCHAR(120) NOT NULL,
        description VARCHAR(500) NOT NULL,
        price_cents BIGINT NOT NULL,
        PRIMARY KEY (id)
    );
