[project]
name = "radius-perf-eval"
version = "0.1.0"
description = "Benchmark harness for the Radius performance experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "github-copilot-sdk==1.0.13",
    "inspect-ai==0.3.263",
]

[project.scripts]
radius-perf-smoke = "radius_perf_eval.smoke:main"
radius-perf-eval-env = "radius_perf_eval.cli:main"

[dependency-groups]
dev = [
    "pytest==8.3.4",
    # Used by CI to re-export requirements-ci.txt and prove it still matches
    # uv.lock. Pinned here so CI installs it through the same hash-checked
    # path as everything else, with no third-party action.
    "uv==0.12.15",
]

# Microsoft Central Feed Services (CFS) proxy.
#
# Committed here so CI and containers inherit it; a machine-level
# ~/.config/uv/uv.toml is not visible to build agents.
#
# Single index only. Do NOT add a second [[tool.uv.index]] entry or an
# extra-index-url: multiple indexes are a dependency-confusion risk and are
# flagged by CFS detectors.
[[tool.uv.index]]
name = "cfs"
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true

[tool.uv]
# Stable releases only. CFS also mirrors pre-release artifacts (for example
# github-copilot-sdk 1.0.14rc1); the benchmark pins stable versions so trials
# stay reproducible.
prerelease = "disallow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# compose/*.yml are committed files inside the package directory, so hatchling
# ships them without an explicit include. Verified by inspecting the built
# wheel, not assumed. Hatchling excludes VCS-ignored files, so these must
# never be gitignored or generated.
[tool.hatch.build.targets.wheel]
packages = ["radius_perf_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
