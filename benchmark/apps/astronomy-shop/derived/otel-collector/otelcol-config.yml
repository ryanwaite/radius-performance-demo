receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_GRPC}
      http:
        endpoint: ${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_HTTP}
        cors:
          allowed_origins:
          - http://*
          - https://*
          allowed_headers:
          - content-type
          - traceparent
          - baggage
  http_check/frontend-proxy:
    targets:
    - endpoint: http://${env:FRONTEND_PROXY_ADDR}
  nginx:
    endpoint: http://${env:IMAGE_PROVIDER_HOST}:${env:IMAGE_PROVIDER_PORT}/status
    collection_interval: 10s
  redis:
    endpoint: valkey-cart:6379
    username: valkey
    collection_interval: 10s
  postgresql:
    endpoint: ${POSTGRES_HOST}:${POSTGRES_PORT}
    username: monitoring_user
    password: ${env:POSTGRES_MONITORING_PASSWORD}
    metrics:
      postgresql.blks_hit:
        enabled: true
      postgresql.blks_read:
        enabled: true
      postgresql.tup_fetched:
        enabled: true
      postgresql.tup_returned:
        enabled: true
      postgresql.tup_inserted:
        enabled: true
      postgresql.tup_updated:
        enabled: true
      postgresql.tup_deleted:
        enabled: true
      postgresql.deadlocks:
        enabled: true
    tls:
      insecure: true
  prometheus/ad:
    config:
      scrape_configs:
      - job_name: ad
        scrape_interval: 10s
        static_configs:
        - targets:
          - ad:${env:AD_PROMETHEUS_PORT}
exporters:
  debug: null
processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource_detection:
    detectors:
    - env
    - docker
    - system
    system:
      hostname_sources:
      - os
      resource_attributes:
        host.arch:
          enabled: true
        host.cpu.vendor.id:
          enabled: true
        host.cpu.family:
          enabled: true
        host.cpu.model.id:
          enabled: true
        host.cpu.model.name:
          enabled: true
        host.cpu.stepping:
          enabled: true
        host.cpu.cache.l2.size:
          enabled: true
        os.description:
          enabled: true
  filter/sanitize_profiles:
    error_mode: ignore
    profiles:
      profile:
      - IsMatch(resource.attributes["service.name"], "containerd-shim-.*")
  transform/sanitize_logs:
    error_mode: ignore
    log_statements:
    - context: scope
      statements:
      - set(attributes["otelcol_signal"], attributes["otelcol.signal"]) where attributes["otelcol.signal"] != nil and not IsMap(attributes["otelcol.signal"])
      - delete_key(attributes, "otelcol.signal") where attributes["otelcol_signal"] != nil
  gen_ai_normalizer:
    sources:
    - name: openllmetry
  transform/sanitize_spans:
    error_mode: ignore
    trace_statements:
    - context: span
      statements:
      - set_semconv_span_name("1.43.0", "original_span_name")
  transform/redact_sensitive_data:
    error_mode: ignore
    trace_statements:
    - context: span
      statements:
      - delete_key(attributes, "demo.payment.card_cvv") where attributes["demo.payment.card_cvv"] != nil
      - set(attributes["user.hash"], SHA256(attributes["user.email"])) where attributes["user.email"] != nil
      - delete_key(attributes, "user.email") where attributes["user.email"] != nil
      - replace_pattern(attributes["demo.payment.card_number"], "^\\d{4}-\\d{4}-\\d{4}-", "****-****-****-") where attributes["demo.payment.card_number"] != nil
  redaction:
    allow_all_keys: true
    ignored_keys:
    - demo.payment.card_number
    blocked_key_patterns:
    - demo\.payment\.card_pin
    - password
    - secret
    summary: info
connectors:
  span_metrics: null
service:
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - resource_detection
      - memory_limiter
      - transform/sanitize_spans
      - gen_ai_normalizer
      - transform/redact_sensitive_data
      - redaction
      exporters:
      - debug
      - span_metrics
    metrics:
      receivers:
      - http_check/frontend-proxy
      - nginx
      - otlp
      - redis
      - postgresql
      - prometheus/ad
      - span_metrics
      processors:
      - resource_detection
      - memory_limiter
      exporters:
      - debug
    logs:
      receivers:
      - otlp
      processors:
      - resource_detection
      - memory_limiter
      - transform/sanitize_logs
      exporters:
      - debug
    profiles:
      receivers:
      - otlp
      processors:
      - resource_detection
      - filter/sanitize_profiles
      - memory_limiter
      exporters:
      - debug
  telemetry:
    metrics:
      readers:
      - periodic:
          exporter:
            otlp:
              protocol: http/protobuf
              endpoint: http://${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_HTTP}
    logs:
      processors:
      - batch:
          exporter:
            otlp:
              protocol: http/protobuf
              endpoint: http://${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_HTTP}
