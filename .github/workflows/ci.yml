name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Verify formatting
        run: |
          test -z "$(gofmt -l $(find cmd internal -name '*.go' -type f))"
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
